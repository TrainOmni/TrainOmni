[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainomni-hap"
version = "0.1.1"
description = "Module-oriented multimodal understanding training framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "transformers>=4.48,<6",
  "safetensors>=0.4",
  "PyYAML>=6",
  "Pillow>=10",
  "pyarrow>=15",
]

[project.optional-dependencies]
video = ["av>=12"]
deepspeed = ["deepspeed>=0.19,<0.20; platform_system != 'Windows'"]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
trainomni = "trainomni.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
