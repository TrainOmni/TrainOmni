schema_version: trainomni.run.v1
name: tiny_llava_public_smoke
seed: 20260820
model:
  plugin: tiny-llava
  config:
    checkpoint: Xenova/tiny-random-LlavaForConditionalGeneration
    load_dtype: fp32
stage:
  stage_id: sft_smoke
  stage_type: instruction_sft
  objective: sft
  objective_impl: masked-causal-lm
  data:
    datasets:
      - dataset_id: tiny_llava
        uri: ../../tests/fixtures/datasets/tiny_llava_sft.jsonl
        importer: canonical
    modalities: [text, image]
    content_blocks: [text, media]
    max_media_per_sample: 1
    packing: false
    padding_free: false
    config:
      max_samples: 1
      max_text_tokens: 256
      max_pixels: 1024
      repeat: true
  component_policy:
    vision_encoder:
      trainable: false
    connector:
      trainable: true
      learning_rate: 0.0001
      gradient_clip: 1.0
    language_model:
      trainable: false
  optimization:
    optimizer: adamw
    learning_rate: 0.0001
    weight_decay: 0.0
    max_steps: 2
    gradient_accumulation_steps: 1
    config:
      scheduler: constant
  engine:
    backend: torch
    parallelism: single
    precision: fp32
    attention_backend: eager
    config:
      device: cpu
  checkpoint:
    every_steps: 1
    resume_level: exact
    export_formats: [hf]
  inputs: {}
  evaluations: []
  gates: []
  outputs: {}
