schema_version: trainomni.run.v1
name: torch_toy_fsdp2_smoke
seed: 1234
model: {plugin: torch-toy-vlm, config: {}}
stage:
  stage_id: sft_fsdp2
  stage_type: instruction_sft
  objective: sft
  objective_impl: masked-causal-lm
  data:
    datasets:
      - {dataset_id: canonical, uri: ../../tests/fixtures/datasets/torch_toy_sft.jsonl, importer: canonical}
    modalities: [text]
    content_blocks: [text]
    max_media_per_sample: 0
    packing: false
    padding_free: false
    config: {max_samples: 1, max_text_tokens: 128, repeat: true}
  component_policy:
    vision_encoder: {trainable: true, learning_rate: 0.001}
    connector: {trainable: true, learning_rate: 0.001}
    language_model: {trainable: true, learning_rate: 0.001}
  optimization:
    optimizer: adamw
    learning_rate: 0.001
    weight_decay: 0.0
    max_steps: 2
    gradient_accumulation_steps: 1
    diagnostics:
      record_gpu_memory: false
      component_grad_norms: true
      component_update_probes: true
      update_probe_chunk_elements: 64
      require_finite_nonzero_gradients: true
      require_parameter_updates: true
      expected_trainable_numel: 1176
      required_components: [vision_encoder, connector, language_model]
  engine:
    backend: torch
    parallelism: fsdp2
    precision: fp32
    attention_backend: eager
    config: {device: cpu}
  checkpoint: {every_steps: 1, resume_level: exact, export_formats: [torch]}
  inputs: {}
  evaluations: []
  gates: []
  outputs: {}
