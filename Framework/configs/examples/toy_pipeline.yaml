schema_version: trainomni.pipeline.v1
name: toy_vlm_pipeline
seed: 20260820
model:
  plugin: toy-vlm
  config: {}
stages:
  - stage_id: align
    stage_type: modality_alignment
    objective: cpt
    data:
      datasets:
        - dataset_id: alignment_data
          uri: ../../tests/fixtures/datasets/canonical_samples.jsonl
          importer: canonical
          config: {reader: jsonl, importer: {}}
      modalities: [text, image]
      content_blocks: [text, media]
      max_media_per_sample: 1
    component_policy:
      vision_encoder: {trainable: false}
      connector: {trainable: true, learning_rate: 0.001}
      language_model: {trainable: false}
    optimization: {max_steps: 2}
    engine:
      backend: torch
      parallelism: single
      precision: fp32
      attention_backend: sdpa
  - stage_id: sft
    stage_type: instruction_sft
    objective: sft
    data:
      datasets:
        - dataset_id: sft_data
          uri: ../../tests/fixtures/datasets/canonical_samples.jsonl
          importer: canonical
          config: {reader: jsonl, importer: {}}
      modalities: [text, image]
      content_blocks: [text, media]
      max_media_per_sample: 1
    component_policy:
      vision_encoder: {trainable: false}
      connector: {trainable: true, learning_rate: 0.0001}
      language_model: {trainable: true, learning_rate: 0.00001}
    optimization: {max_steps: 2}
    engine:
      backend: torch
      parallelism: single
      precision: fp32
      attention_backend: sdpa
    gates:
      - {type: metric, metric: eval_loss, op: le, value: 10.0}
edges:
  - from_stage: align
    to_stage: sft
    input_slot: model
    selector: best
