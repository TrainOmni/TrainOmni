[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainomni-framework"
version = "1.0.0"
description = "Composable, VLM-first omni-modal training framework"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
torch = [
  "torch>=2.4",
  "transformers>=4.45,<6",
  "accelerate>=1.0,<2",
  "safetensors>=0.4,<1",
  "Pillow>=10,<13",
]
data = [
  "datasets>=3.0,<5",
  "pyarrow>=17,<24",
  "webdataset>=0.2.100,<2",
]
peft = ["peft>=0.13,<1"]
bitsandbytes = ["bitsandbytes>=0.49,<1"]
eval = ["lmms-eval>=0.3,<1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
trainomni = "trainomni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
