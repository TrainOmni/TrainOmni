schema_version: trainomni.run.v1
name: toy_data_inspection
seed: 20260820

model:
  plugin: toy-vlm
  config: {}

stage:
  stage_id: inspect_001
  stage_type: instruction_sft
  objective: sft
  data:
    datasets:
      - dataset_id: inspect_fixture
        uri: ../../tests/fixtures/datasets/canonical_samples.jsonl
        importer: canonical
        weight: 1.0
        config:
          reader: jsonl
          importer: {}
    modalities: [text, image]
    content_blocks: [text, media, bbox]
    max_media_per_sample: 1
    config:
      max_samples: 2
      max_text_tokens: 64
      max_vision_tokens: 64
      max_pixels: 1000000
  component_policy:
    vision_encoder: {trainable: false}
    connector: {trainable: true, learning_rate: 0.001}
    language_model: {trainable: false}
  optimization:
    max_steps: 2
  engine:
    backend: torch
    parallelism: single
    precision: fp32
    attention_backend: sdpa
  checkpoint:
    every_steps: 1
    resume_level: exact
